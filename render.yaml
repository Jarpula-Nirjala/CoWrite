services:
  - type: web
    name: cowrite
    runtime: node
    plan: free
    # `npm run build` keeps the build within the free plan's 512 MB (see scripts/build.mjs).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Postgres connection string (e.g. from Neon). Without it, data lives on
      # the service's temporary disk and is lost on every restart.
      - key: DATABASE_URL
        sync: false
      # Public address, used in password-reset emails and OAuth redirects.
      - key: PUBLIC_URL
        sync: false
      # Optional features: each switches on when its value is set.
      # Free Google Gemini key for the site's AI (people can also add their own).
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Comma-separated emails of the site owner(s): they can set up the Google and GitHub sign-in apps.
      - key: ADMIN_EMAILS
        sync: false
      # Encrypts people's own AI keys at rest.
      - key: APP_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
